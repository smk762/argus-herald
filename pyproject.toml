[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-herald"
dynamic = ["version"]
description = "Release announcements for any Python package: drafted from PyPI and GitHub, held for review, published to your channels."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "argus-cortex>=0.14,<0.15",  # argus_cortex.hashing.sha256_hex (digest.py)
    "Pillow>=10",
    "PyYAML>=6",
    "itsdangerous>=2",
    "jinja2>=3.1",
    "packaging>=22",
    "python-multipart>=0.0.9",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.15.16"]
claude = ["anthropic>=2.8"]

[project.scripts]
argus-herald = "argus_herald.cli:main"

[project.entry-points."argus_herald.platforms"]
twitter = "argus_herald.platforms:TwitterPublisher"
discord = "argus_herald.platforms:DiscordPublisher"
telegram = "argus_herald.platforms:TelegramPublisher"
patreon = "argus_herald.platforms:PatreonPublisher"

[project.urls]
Repository = "https://github.com/smk762/argus-herald"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_herald/_version.py"

[tool.hatch.build.targets.sdist]
# An allow-list: a local build must never pick up untracked notes or tests/bombadil/node_modules.
only-include = ["src", "tests", "examples", "contrib", "README.md", "LICENSE", "config.example.yaml", ".env.example"]
exclude = ["tests/bombadil/node_modules", "tests/bombadil/out", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/argus_herald"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_herald/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
