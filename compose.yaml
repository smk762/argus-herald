name: argus-herald

services:
  watcher:
    build: .
    image: argus-herald:local
    env_file:
      - path: .env
        required: false
    environment:
      ARGUS_HERALD_CONFIG: /config/config.yaml
      ARGUS_HERALD_STORE: /data/state.sqlite
      ARGUS_HERALD_HEARTBEAT: /data/heartbeat
      ARGUS_HERALD_UI_URL: http://127.0.0.1:8787
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - argus-herald-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "argus-herald", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 40s

  review:
    image: argus-herald:local
    command: ["ui", "--host", "0.0.0.0", "--port", "8787"]
    env_file:
      - path: .env
        required: false
    environment:
      ARGUS_HERALD_CONFIG: /config/config.yaml
      ARGUS_HERALD_STORE: /data/state.sqlite
      ARGUS_HERALD_UI_URL: http://127.0.0.1:8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - argus-herald-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - watcher

volumes:
  argus-herald-data:
    # The volume compose created before the rename (project pip-release), so the drafts carry over.
    name: pip-release_pip-release-data
