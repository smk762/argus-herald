# Public identities only. Copy to config.yaml and replace the values.
# Secrets belong in .env. See .env.example.

pypi:
  user: your-pypi-username
  projects:
    - your-project
  ignore: []
  # discover:            # argus-herald discover --check also reads these GitHub repos
  #   github_owner: your-github-user
  #   prefix: your-prefix-

destinations:
  twitter:
    enabled: true
    username: your-x-username
    # audience:                    # optional; every destination can have one
    #   description: who follows this account
    #   tone: plain and specific
    #   packages: [your-pkg-*]       # or {include: [...], exclude: [...]}; default: everything
    #   hashtags: [python]           # appended while they fit (X: at most 2)
    #   link_placement: reply        # body (default) or reply (X, Bluesky, Mastodon)
    # schedule:                    # optional; approved drafts wait for a slot (UTC)
    #   slots: [Tue 08:00, Fri 08:00]
    #   min_gap_hours: 24
    #   offset_minutes: 0          # shift from the post's shared time on other platforms
    #   grace_hours: 6             # a slot missed by more than this isn't posted late
    mode: manual  # Open in X link, posted by a person. `api` posts with the X API (billed per post).
  discord:
    enabled: false
  telegram:
    enabled: false
  patreon:
    enabled: false
    name: YourCampaign
    url: https://www.patreon.com/c/YourCampaign

privacy:
  # The deny-list itself is a private file: ~/.config/argus-herald/opsec-denylist.txt
  allow_addresses: []
  patterns: {}

# Optional: GitHub Releases as a source (repos without PyPI, or for better notes).
# github:
#   owner: your-github-user
#   prefix: your-prefix-        # or repos: [repo-a, repo-b]
#   include_prereleases: true   # collected into digests, never drafted alone

# Optional: posts that aren't releases.
# sources:
#   site:
#     feed: https://example.org/updates.xml   # Atom; entries with these categories become posts
#     categories: [note]
#   youtube:
#     channel_id: UC...                       # youtube.com/channel/UC...
#     platforms: [twitter]                    # default: every enabled destination
#   mint:                                     # teasers approved in argus-mint; ARGUS_MINT_URL in .env
#     project: example-teasers                # optional: only this mint project
#     platforms: [twitter]                    # default: every enabled destination that takes images

# Optional: collect releases into windows instead of one post per release.
# digest:
#   anchor: 2026-11-16          # first day of the first window (UTC)
#   window_days: 14
#   site_url: https://example.org/updates/
#   site_dir: ../my-site/src/content/updates   # herald writes <window end>-digest.md here, draft: true

# Optional: a model writes the first draft of digest and headline posts.
# drafting:
#   backend: openai_compatible   # with ARGUS_HERALD_LLM_BASE_URL and ARGUS_HERALD_LLM_MODEL in .env
#   # backend: anthropic         # pip install 'argus-herald[claude]'; model defaults to claude-opus-5-5

# Follower counts recorded by collect (they needn't be destinations). X counts are imported by hand.
# accounts:
#   bluesky: dragonhound.dev
#   mastodon: "@name@instance.social"

# Optional: where the demos behind registry clips live, for `clips refresh` and collect.
# clips:
#   owner: your-github-user     # for a bare demo_repo; default github.owner, then pypi.discover.github_owner
#   branch: dev                 # the deploy branch the live demo is built from
#   # A UI file matches ui_paths and not ignore_paths; a change to any other file asks for a check, not a redo.
#   # These are the defaults. Setting ui_paths keeps the default ignore_paths; `ignore_paths: []` turns it off.
#   ui_paths: ["*.css", "*.scss", "*.html", "*.tsx", "*.jsx", "*.ts", "*.js", "*.mjs", "*.svelte", "*.astro", "*.vue"]
#   ignore_paths: ["**/tests/**", "**/test/**", "**/__tests__/**", "**/docs/**", "**/scripts/**", "**/e2e/**",
#                  "*.test.*", "*.spec.*", "*.config.*", "*.d.ts"]
#   demos:                      # a demo's own branch, ui_paths or ignore_paths replaces the global one
#     your-demo: {branch: main, ui_paths: ["web/**", "*.css"], ignore_paths: ["web/vendor/**"]}
#   performance:                # how `clips` rates a clip's posts against your own recent posts
#     strong: 1.5               # median at or above 1.5x the platform's baseline median
#     weak: 0.5                 # at or below 0.5x
#     min_posts: 5              # fewer baseline posts than this on a platform: no data
#     days: 30                  # the baseline: that platform's posts from the last 30 days
#     min_age_hours: 24         # a post younger than this is left out of the rating; 0 turns that off

poll:
  interval_seconds: 1800

store:
  path: .argus-herald/state.sqlite
