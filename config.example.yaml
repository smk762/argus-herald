# Public identities only. Copy to config.yaml and replace the values.
# Secrets belong in .env. See .env.example.

pypi:
  user: your-pypi-username
  projects:
    - your-project
  ignore: []
  # discover:            # pip-release discover --check also reads these GitHub repos
  #   github_owner: your-github-user
  #   prefix: your-prefix-

destinations:
  twitter:
    enabled: true
    username: your-x-username
    mode: manual  # Open in X link, posted by a person. `api` posts with the X API (billed per post).
  discord:
    enabled: false
  telegram:
    enabled: false
  patreon:
    enabled: false
    name: YourCampaign
    url: https://www.patreon.com/c/YourCampaign

privacy:
  # The deny-list itself is a private file: ~/.config/pip-release/opsec-denylist.txt
  allow_addresses: []
  patterns: {}

# Optional: posts that aren't releases.
# sources:
#   site:
#     feed: https://example.org/updates.xml   # Atom; entries with these categories become posts
#     categories: [note]
#   youtube:
#     channel_id: UC...                       # youtube.com/channel/UC...
#     platforms: [twitter]                    # default: every enabled destination

poll:
  interval_seconds: 1800

store:
  path: .pip-release/state.sqlite
