# Public identities only. Copy to config.yaml and replace the values.
# Secrets belong in .env. See .env.example.

pypi:
  user: your-pypi-username
  projects:
    - your-project
  ignore: []
  # discover:            # pip-release discover --check also reads these GitHub repos
  #   github_owner: your-github-user
  #   prefix: your-prefix-

destinations:
  twitter:
    enabled: true
    username: your-x-username
    # audience:                    # optional; every destination can have one
    #   description: who follows this account
    #   tone: plain and specific
    #   packages: [your-pkg-*]       # or {include: [...], exclude: [...]}; default: everything
    #   hashtags: [python]           # appended while they fit (X: at most 2)
    #   link_placement: reply        # body (default) or reply (X, Bluesky, Mastodon)
    # schedule:                    # optional; approved drafts wait for a slot (UTC)
    #   slots: [Tue 08:00, Fri 08:00]
    #   min_gap_hours: 24
    #   offset_minutes: 0          # shift from the post's shared time on other platforms
    #   grace_hours: 6             # a slot missed by more than this isn't posted late
    mode: manual  # Open in X link, posted by a person. `api` posts with the X API (billed per post).
  discord:
    enabled: false
  telegram:
    enabled: false
  patreon:
    enabled: false
    name: YourCampaign
    url: https://www.patreon.com/c/YourCampaign

privacy:
  # The deny-list itself is a private file: ~/.config/pip-release/opsec-denylist.txt
  allow_addresses: []
  patterns: {}

# Optional: GitHub Releases as a source (repos without PyPI, or for better notes).
# github:
#   owner: your-github-user
#   prefix: your-prefix-        # or repos: [repo-a, repo-b]
#   include_prereleases: true   # collected into digests, never drafted alone

# Optional: posts that aren't releases.
# sources:
#   site:
#     feed: https://example.org/updates.xml   # Atom; entries with these categories become posts
#     categories: [note]
#   youtube:
#     channel_id: UC...                       # youtube.com/channel/UC...
#     platforms: [twitter]                    # default: every enabled destination

# Optional: collect releases into windows instead of one post per release.
# digest:
#   anchor: 2026-11-16          # first day of the first window (UTC)
#   window_days: 14
#   site_url: https://example.org/updates/
#   site_dir: ../my-site/src/content/updates   # herald writes <window end>-digest.md here, draft: true

# Optional: a model writes the first draft of digest and headline posts.
# drafting:
#   backend: openai_compatible   # with PIP_RELEASE_LLM_BASE_URL and PIP_RELEASE_LLM_MODEL in .env
#   # backend: anthropic         # pip install 'pip-release[claude]'; model defaults to claude-opus-5-5

# Follower counts recorded by collect (they needn't be destinations). X counts are imported by hand.
# accounts:
#   bluesky: dragonhound.dev
#   mastodon: "@name@instance.social"

poll:
  interval_seconds: 1800

store:
  path: .pip-release/state.sqlite
