# Optional: mount the Argus suite settings file (argus_cortex.settings) into herald's containers, read-only.
#
#   COMPOSE_FILE=compose.yaml:compose.suite.yaml          # in .env, or pass both files with -f
#
# A separate file because compose cannot make a bind mount optional: with it in compose.yaml, a host without a
# suite file would not start. Herald reads one value from it, ARGUS_MINT_URL (mint's address, for sources.mint),
# and only when .env does not set it. Its platform tokens and ARGUS_MINT_POSTER_TOKEN are never read from here.
#
# Known limit (smk762/argus-cortex#218): argus-cortex reads the file only when it belongs to the user the process
# runs as, or to root. These containers run as uid 10001, which cannot open a mode-600 file it does not own, so
# today the mounted file has to be root-owned. Otherwise it is ignored with a warning and herald behaves as if
# there were none: keep ARGUS_MINT_URL in .env.
x-suite-env: &suite-env
  type: bind
  source: "${ARGUS_SUITE_ENV:-${HOME}/.config/argus/suite.env}"
  target: /etc/argus/suite.env
  read_only: true
  bind: {create_host_path: false}

services:
  watcher:
    volumes:
      - *suite-env
  review:
    volumes:
      - *suite-env
