# Development fixture. Public identities only.
# PyPI does not publish a per-user release feed, and the profile page is often
# behind a client challenge, so the projects are listed here.

pypi:
  user: dragonhound_dev
  projects:
    - argus-atlas
    - argus-lens
    - argus-cortex
    - argus-quarry
    - argus-forge
    - argus-proof
    - argus-curator
    - argus-darkroom
    - argus-survey
    - argus-mask
    - argus-mint
  ignore: []
  # discover --check: argus-* repos on GitHub that publish to PyPI must be listed above
  discover:
    github_owner: smk762
    prefix: argus-

destinations:
  twitter:
    enabled: true
    username: dragonhound3
    mode: manual
  patreon:
    enabled: true
    name: AtlasRealms
    url: https://www.patreon.com/c/AtlasRealms
  discord:
    enabled: false
  telegram:
    enabled: false

# GitHub Releases: repos that don't ship to PyPI (Studio, demo UIs) reach the digest too. A version
# also on PyPI is kept once, under pypi, with the GitHub notes.
github:
  owner: smk762
  prefix: argus-

# Posts that aren't releases. The first read of each feed baselines it; later items become drafts.
sources:
  site:
    feed: https://dragonhound.dev/updates.xml
    categories: [note]   # build notes; digests are drafted by herald itself
    platforms: [twitter]
  youtube:
    channel_id: UCxZha6M0r90kFIGkFvKRvcw   # youtube.com/@dragonhound7227
    platforms: [twitter]

# Releases are collected into 14-day windows (Mondays, UTC). When one closes, herald drafts a
# site page (draft: true) and one post per destination. Never commits or pushes the site.
digest:
  anchor: 2026-11-16
  window_days: 14
  site_url: https://dragonhound.dev/updates/
  # site_dir: <your checkout of the site>/src/content/updates   (local config only)

poll:
  interval_seconds: 1800

store:
  path: .pip-release/state.sqlite
