# Development fixture. Public identities only.
# PyPI does not publish a per-user release feed, and the profile page is often
# behind a client challenge, so the projects are listed here.

pypi:
  user: dragonhound_dev
  projects:
    - argus-atlas
    - argus-lens
    - argus-cortex
    - argus-quarry
    - argus-forge
    - argus-proof
    - argus-curator
    - argus-darkroom
    - argus-survey
    - argus-mask
    - argus-mint
  ignore: []
  # discover --check: argus-* repos on GitHub that publish to PyPI must be listed above
  discover:
    github_owner: smk762
    prefix: argus-

destinations:
  twitter:
    enabled: true
    username: dragonhound3
    mode: manual
  patreon:
    enabled: true
    name: AtlasRealms
    url: https://www.patreon.com/c/AtlasRealms
  discord:
    enabled: false
  telegram:
    enabled: false

# Posts that aren't releases. The first read of each feed baselines it; later items become drafts.
sources:
  site:
    feed: https://dragonhound.dev/updates.xml
    categories: [note]   # build notes; digests are drafted by herald itself
    platforms: [twitter]
  youtube:
    channel_id: UCxZha6M0r90kFIGkFvKRvcw   # youtube.com/@dragonhound7227
    platforms: [twitter]

poll:
  interval_seconds: 1800

store:
  path: .pip-release/state.sqlite
