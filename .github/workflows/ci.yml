name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: smk762/argus-ci/.github/workflows/python-ci.yml@v1
    with:
      ruff-version: "0.15.16"
      test-extras: "dev,claude"

  ui-properties:
    # Bombadil explores the review UI (seeded store, fake publishers) in light, dark and
    # token-locked modes. Results are uploaded when a property fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the dev version from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e .
      - run: npm ci
        working-directory: tests/bombadil
      - name: Run Bombadil
        run: CHROME="$(command -v google-chrome || command -v chromium)" TIME_LIMIT=2m BOMBADIL_ARGS=--no-sandbox tests/bombadil/run.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bombadil-output
          path: tests/bombadil/out
          retention-days: 7
